# Reads from environment variables in production (set these in Railway).
# Falls back to your local MySQL for testing on your own machine.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Zxcvbnm054@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Railway (and most cloud hosts) tell your app which port to listen on via $PORT.
server.port=${PORT:8080}

spring.thymeleaf.cache=false
