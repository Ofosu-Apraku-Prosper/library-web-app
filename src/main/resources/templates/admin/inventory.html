<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Inventory - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="header-bar">
    <h1>📦 Book Inventory</h1>
    <p>Add, search, and remove titles from the catalog</p>
</div>
<div th:replace="~{fragments/header :: nav}"></div>

<div class="container">
    <div class="alert success" th:if="${message}" th:text="${message}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <form th:action="@{/admin/inventory}" method="get" style="margin-bottom:14px; display:flex; gap:10px;">
            <input type="text" name="q" placeholder="Search by title..." style="flex:1; padding:9px; border-radius:6px; border:1px solid #ccc;">
            <button type="submit" class="btn primary">Search</button>
            <a th:href="@{/admin/inventory}" class="btn accent">Show All</a>
        </form>

        <table>
            <thead>
            <tr><th>Title</th><th>Author</th><th>ISBN</th><th>Total</th><th>Available</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.title}"></td>
                <td th:text="${book.author}"></td>
                <td th:text="${book.isbn}"></td>
                <td th:text="${book.totalCopies}"></td>
                <td>
                    <span class="badge" th:classappend="${book.availableCopies > 0} ? 'green' : 'red'"
                          th:text="${book.availableCopies}"></span>
                </td>
                <td>
                    <form th:action="@{/admin/inventory/delete}" method="post" class="inline-form"
                          onsubmit="return confirm('Delete this book permanently?');">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <button type="submit" class="btn danger">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(books)}">
                <td colspan="6" style="text-align:center; color:#888;">No books found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Add a New Book</h2>
        <form th:action="@{/admin/inventory/add}" method="post" style="display:flex; gap:10px; flex-wrap:wrap; align-items:end;">
            <div class="form-group" style="flex:2; min-width:180px;">
                <label>Title</label>
                <input type="text" name="title" required>
            </div>
            <div class="form-group" style="flex:2; min-width:150px;">
                <label>Author</label>
                <input type="text" name="author" required>
            </div>
            <div class="form-group" style="flex:2; min-width:150px;">
                <label>ISBN</label>
                <input type="text" name="isbn">
            </div>
            <div class="form-group" style="flex:1; min-width:80px;">
                <label>Copies</label>
                <input type="number" name="copies" min="1" value="1" required>
            </div>
            <button type="submit" class="btn success" style="margin-bottom:14px;">Add Book</button>
        </form>
    </div>
</div>
</body>
</html>
