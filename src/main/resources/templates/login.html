<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <div class="card auth-card">
        <h2>📚 Library Management System</h2>
        <p style="color:#666; margin-top:-10px;">Sign in to continue</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <div class="alert success" th:if="${param.registered}">Account created! You can now log in.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn accent" style="width:100%; margin-bottom:10px;">Log In</button>
        </form>
        <a th:href="@{/register}" class="btn primary" style="width:100%; text-align:center; box-sizing:border-box;">Create a New Account</a>
    </div>
</div>
</body>
</html>
