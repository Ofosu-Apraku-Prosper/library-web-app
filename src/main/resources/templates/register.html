<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <div class="card auth-card">
        <h2>📝 Create Your Account</h2>
        <p style="color:#666; margin-top:-10px;">Join the library in a few seconds</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullName" required autofocus>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirmPassword" required>
            </div>
            <button type="submit" class="btn success" style="width:100%;">Register</button>
        </form>
        <p style="text-align:center; margin-top:14px;">
            <a th:href="@{/login}">Already have an account? Log in</a>
        </p>
    </div>
</div>
</body>
</html>
